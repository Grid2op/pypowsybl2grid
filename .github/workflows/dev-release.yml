name: Dev Release

on:
  push:
    branches:
      - main
    tags:
      - "dev[0-9]+.[0-9]+.[0-9]+*"

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}

      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  dev-release:
    runs-on: ubuntu-22.04
    needs: lint

    environment:
      name: pypi
      url: https://pypi.org/p/pypowsybl2grid

    permissions:
      id-token: write

    steps:
      - name: Install Ubuntu packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt -y install maven

      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock') }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Set dev version
        run: |
          python3 << 'EOF'
          import re, os
          tag = os.environ['GITHUB_REF_NAME']          # e.g. dev0.3.1
          version = tag.removeprefix('dev')            # e.g. 0.3.1
          dev_ver = f"{version}.dev{os.environ['GITHUB_RUN_NUMBER']}"
          with open('pyproject.toml', 'r') as f:
              content = f.read()
          content = re.sub(r'(?m)^version = ".*"', f'version = "{dev_ver}"', content)
          with open('pyproject.toml', 'w') as f:
              f.write(content)
          print(f"Version set to: {dev_ver}")
          EOF

      - name: Run tests
        run: uv run pytest

      - name: Build wheel
        run: uv build

      - name: Publish on PyPi
        uses: pypa/gh-action-pypi-publish@release/v1
